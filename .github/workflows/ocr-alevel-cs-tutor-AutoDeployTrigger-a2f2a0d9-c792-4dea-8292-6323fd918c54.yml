name: Trigger auto deployment for ocr-alevel-cs-tutor

on:
  push:
    branches: 
      - main
    paths:
      - '**'
      - '.github/workflows/ocr-alevel-cs-tutor-AutoDeployTrigger-a2f2a0d9-c792-4dea-8292-6323fd918c54.yml'

  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write
      contents: read

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.OCRALEVELCSTUTOR_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.OCRALEVELCSTUTOR_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.OCRALEVELCSTUTOR_AZURE_SUBSCRIPTION_ID }}

      - name: Build and deploy Container App
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          containerAppName: ocr-alevel-cs-tutor
          resourceGroup: socratic-tutor-rg
          ingress: external
          targetPort: 8501